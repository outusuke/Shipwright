name: android
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  generate-soh-otr:
    runs-on: ubuntu-22.04
    steps:
    - name: Git Checkout
      uses: actions/checkout@v7
      with:
        submodules: true
    - name: Configure ccache
      uses: hendrikmuhs/ccache-action@v1.2.23
      with:
        max-size: "2G"
        evict-old-files: job
        save: ${{ github.ref_name == github.event.repository.default_branch }}
        key: ${{ runner.os }}-otr-ccache-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-otr-ccache-${{ github.ref }}
          ${{ runner.os }}-otr-ccache
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y $(cat linux-build-deps/apt.txt)
    - name: Add ccache to PATH
      run: |
        echo "/usr/lib/ccache" >> "$GITHUB_PATH"
        echo "/usr/local/opt/ccache/libexec" >> "$GITHUB_PATH"
    - name: Generate soh.o2r
      run: |
        cmake --no-warn-unused-cli -H. -Bbuild-cmake -GNinja -DCMAKE_BUILD_TYPE:STRING=Release -DSOH_TOOLS_ONLY=ON
        cmake --build build-cmake --config Release --target GenerateSohOtr -j4
    - name: Upload soh.o2r
      uses: actions/upload-artifact@v7
      with:
        name: soh.o2r
        path: soh.o2r
        retention-days: 3

  build-android:
    needs: generate-soh-otr
    runs-on: ubuntu-22.04
    steps:
    - name: Git Checkout
      uses: actions/checkout@v7
      with:
        submodules: true
    - name: Setup JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
    - name: Install Android SDK components
      # Versions match android/app/build.gradle.kts
      run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.30.3" "ndk;30.0.15729638" "platforms;android-36" "build-tools;36.0.0" > /dev/null
    # PackGameData reads soh.o2r from the repo root
    - name: Download soh.o2r
      uses: actions/download-artifact@v8
      with:
        name: soh.o2r
        path: .
    - name: Prepare signing key
      env:
        KEYSTORE_BASE64: ${{ secrets.SOH_KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/soh.p12"
          echo "SOH_KEYSTORE_FILE=$RUNNER_TEMP/soh.p12" >> "$GITHUB_ENV"
        fi
    - name: Build APK
      env:
        SOH_KEYSTORE_PASSWORD: ${{ secrets.SOH_KEYSTORE_PASSWORD }}
      run: android/gradlew -p android assembleRelease
    # gradle stops at the first failing file, so keep compiling to list every error
    - name: List all compile errors
      if: failure()
      run: |
        BUILD_DIR=$(ls -d android/app/.cxx/Release/*/arm64-v8a 2>/dev/null | head -1)
        if [ -z "$BUILD_DIR" ] || [ ! -f "$BUILD_DIR/build.ninja" ]; then
          echo "No build.ninja found, the failure was before compilation"
          exit 0
        fi
        "$ANDROID_HOME/cmake/3.30.3/bin/ninja" -C "$BUILD_DIR" -k 0 soh 2>&1 | tee ninja.log || true
        {
          echo '### Compile errors'
          echo '```'
          grep -E "error:|undefined (reference|symbol)" ninja.log | sort -u
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Collect APK
      run: |
        APK=android/app/build/outputs/apk/release/app-release.apk
        ls -la "$APK" || (echo "ERROR: APK not found" && exit 1)
        for entry in assets/gamedata.zip assets/gamedata.version; do
          unzip -Z1 "$APK" | grep -qx "$entry" || (echo "ERROR: $entry missing from the APK" && exit 1)
        done
        cp "$APK" soh.apk
    - name: Upload build
      uses: actions/upload-artifact@v7
      with:
        name: soh-android
        path: soh.apk
